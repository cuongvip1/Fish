<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Câu Cá</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<h1>🎣 CÂU CÁ</h1>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="overlay">
    <h2>🎣 Câu Cá</h2>
    <p>
      <b>Giữ chuột</b> để tăng lực, <b>thả</b> để ném mồi.<br>
      Khi phao chìm xuống — <b>click nhanh</b> để giật cần!<br>
      <b>Giữ chuột</b> (hoặc <b>Space</b>) để quay cần kéo cá lên. Coi chừng dây đứt!
    </p>
    <button id="startBtn">BẮT ĐẦU</button>
  </div>
</div>
<div id="hint">90 giây — câu được càng nhiều cá càng tốt. Cá hiếm ở sâu hơn, nhiều điểm hơn.</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
